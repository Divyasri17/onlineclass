<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000fe6;
            --primary-hover: #000bc1;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #020617; /* Thicker/darker text */
            --text-muted: #475569;
            --border-color: #cbd5e1;
            --icon-color: #64748b;
            --input-bg: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--text-main);
            position: relative;
            overflow-x: hidden;
            /* T-shirt website mesh background setup */
            background-image: 
                radial-gradient(circle at 10% 20%, #e0e7ff 0%, transparent 60%), 
                radial-gradient(circle at 90% 80%, #ede9fe 0%, transparent 60%);
        }

        /* Abstract Premium Background Elements for T-Shirt Store */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -5%;
            width: 50vw;
            height: 50vw;
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            border-radius: 50% 40% 60% 40% / 40% 50% 50% 60%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: -1;
            animation: float 12s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -10%;
            right: -5%;
            width: 55vw;
            height: 55vw;
            background: linear-gradient(135deg, #c2e9fb 0%, #a1c4fd 100%);
            border-radius: 40% 60% 50% 50% / 50% 40% 60% 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
            animation: float 15s ease-in-out infinite reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(30px, -40px) rotate(10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Mobile Phone Frame Style */
        .signup-container {
            width: 100%;
            max-width: 420px; /* Slightly wider to accommodate larger text */
            background: var(--card-bg);
            border: 8px solid #ffffff; /* Phone-like bezel */
            border-radius: 40px; 
            padding: 2.8rem 2.2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0,0,0,0.05);
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.2rem; /* Larger font size */
            font-weight: 800; /* Thicker */
            color: #000;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 1.4rem;
        }

        .form-group .field-label {
            display: block;
            font-size: 0.95rem; /* Larger */
            font-weight: 700; /* Thicker */
            margin-bottom: 0.5rem;
            margin-left: 0.6rem;
            color: #000; /* Thicker solid color */
        }

        .input-with-icon {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-icon svg {
            position: absolute;
            left: 1.2rem;
            width: 22px; /* Marginally bigger icon */
            height: 22px;
            color: var(--icon-color);
            transition: color 0.3s ease;
            z-index: 2;
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 2px solid var(--border-color); /* Thicker border */
            border-radius: 9999px; 
            padding: 1rem 1.5rem 1rem 3.5rem; /* Larger padding */
            color: var(--text-main);
            font-size: 1.05rem; /* Larger font size */
            font-weight: 600; /* Thicker font weight */
            transition: all 0.3s ease;
            outline: none;
        }

        .form-control::placeholder {
            color: #94a3b8;
            font-weight: 500;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 15, 230, 0.1);
        }

        .input-with-icon:focus-within svg {
            color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 9999px;
            padding: 1.15rem; /* Larger */
            font-size: 1.15rem; /* Larger */
            font-weight: 800; /* Thicker */
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 15, 230, 0.3);
            letter-spacing: 0.5px;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            background: var(--primary-hover);
            box-shadow: 0 8px 25px rgba(0, 15, 230, 0.4);
        }

        .social-signup {
            text-align: center;
            margin-top: 2rem;
        }

        .social-signup p {
            font-size: 0.95rem; /* Larger */
            font-weight: 700; /* Thicker */
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1.25rem; /* Increase gap */
        }

        .social-btn {
            width: 50px; /* Larger */
            height: 50px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid var(--border-color); /* Thicker border */
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            font-weight: 800; /* Thicker */
            font-size: 1.3rem; /* Larger */
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .social-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .footer-text {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.95rem; /* Larger */
            font-weight: 700; /* Thicker */
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 800; /* Thicker */
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
        
        .forgot-password {
            text-align: right;
            margin-top: -0.5rem;
            margin-bottom: 1.5rem;
            margin-right: 0.5rem;
        }
        
        .forgot-password a {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

    </style>
    
    
    <script>
    let msg = "[[${msg}]]";
    if (msg && msg !== "") {
        alert(msg);
    }
    </script>

</head>
<body>

    <div class="signup-container">
        <div class="header">
            <h1>Login</h1>
        </div>

<form action="/login" method="post">
            <div class="form-group">
                <span class="field-label">Username</span>
                <div class="input-with-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <input type="text" name="name" class="form-control" placeholder="Enter Your Full Name" required>
                </div>
            </div>

            <div class="form-group">
                <span class="field-label">Email</span>
                <div class="input-with-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 0.5rem;">
                <span class="field-label">Password</span>
                <div class="input-with-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
            </div>
            
            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-submit">Login</button>

            <div class="social-signup">
                <p>Login with</p>
                <div class="social-icons">
                    <button type="button" class="social-btn">f</button>
                    <button type="button" class="social-btn">G</button>
                </div>
            </div>

            <div class="footer-text">
                Don't have an account? <a href="/signup">Sign Up</a>
            </div>

        </form>
    </div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Session</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
    135deg,
    #eef4ff,
    #f8fbff);

    padding:30px;
}

.card{

    width:100%;
    max-width:750px;

    background:white;

    border-radius:30px;

    padding:50px;

    box-shadow:
    0 20px 50px
    rgba(0,0,0,.08);
}

.header{

    text-align:center;
    margin-bottom:40px;
}

.header h1{

    font-size:42px;

    background:
    linear-gradient(
    90deg,
    #2563eb,
    #4f46e5);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    margin-bottom:10px;
}

.header p{

    color:#64748b;
}

.input-box{

    margin-bottom:25px;
}

.input-box label{

    display:block;

    margin-bottom:10px;

    color:#2563eb;

    font-weight:700;
}

.input-box input{

    width:100%;

    padding:18px;

    border:none;

    border-radius:16px;

    background:#f1f5f9;

    font-size:16px;
}

.input-box input:focus{

    outline:none;

    box-shadow:
    0 0 0 4px
    rgba(37,99,235,.15);

    background:white;
}

.info{

    background:#eef4ff;

    border-left:
    5px solid #2563eb;

    padding:20px;

    border-radius:12px;

    margin-top:10px;
}

.info h3{

    color:#2563eb;
    margin-bottom:8px;
}

.info p{

    color:#475569;
}

.btn{

    width:100%;

    margin-top:30px;

    border:none;

    padding:18px;

    border-radius:16px;

    cursor:pointer;

    color:white;

    font-size:18px;
    font-weight:700;

    background:
    linear-gradient(
    90deg,
    #2563eb,
    #4f46e5);
}

.btn:hover{

    transform:
    translateY(-3px);
}

</style>

</head>
<body>

<div class="card">

    <div class="header">

        <h1>Add Session</h1>

        <p>
            Schedule a class session for this offering.
        </p>

    </div>
    
    <div th:if="${param.error}"
     style="
     background:#fee2e2;
     color:#dc2626;
     padding:15px;
     border-radius:10px;
     margin-bottom:20px;">
     
     End Time must be greater than Start Time.
</div>

    <form action="/session/save"
          method="post">

        <input type="hidden"
               name="offeringId"
               th:value="${offeringId}">

        <div class="input-box">

            <label>
                Start Date & Time
            </label>

            <input type="datetime-local"
                   name="startTimeUtc"
                   required>

        </div>

        <div class="input-box">

            <label>
                End Date & Time
            </label>

            <input type="datetime-local"
                   name="endTimeUtc"
                   required>

        </div>

        <div class="info">

            <h3>Session Rules</h3>

            <p>
                End time must be greater than
                start time.
            </p>

        </div>

        <button class="btn">

            Save Session

        </button>

    </form>

</div>

</body>
</html>

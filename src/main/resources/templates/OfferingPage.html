<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Course Offerings</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{
    background:#f4f7fc;
    min-height:100vh;
    padding:40px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.header{
    margin-bottom:40px;
}

.header h1{
    font-size:40px;
    color:#111827;
    margin-bottom:10px;
}

.header p{
    color:#6b7280;
}

.course-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(320px,1fr));

    gap:30px;
}

.course-card{
    background:white;
    border-radius:22px;
    overflow:hidden;
    text-decoration:none;
    color:black;

    box-shadow:
    0 10px 25px rgba(0,0,0,.08);

    transition:.35s;
}

.course-card:hover{
    transform:
    translateY(-10px)
    scale(1.02);

    box-shadow:
    0 20px 40px rgba(0,15,230,.18);
}

.course-card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.course-content{
    padding:20px;
}

.course-content h3{
    color:#111827;
    margin-bottom:12px;
    font-size:24px;
}

.course-content p{
    color:#6b7280;
    line-height:1.6;
}

.open-btn{
    display:inline-block;
    margin-top:20px;
    background:#000fe6;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    font-weight:600;
}

.no-course{
    text-align:center;
    margin-top:120px;
}

.no-course h2{
    margin-bottom:10px;
    color:#111827;
}

.no-course p{
    color:#6b7280;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Course Offerings</h1>

        <p>
            Select a course to manage
            its offerings.
        </p>

    </div>

    <div class="no-course"
         th:if="${#lists.isEmpty(courses)}">

        <h2>No Courses Found</h2>

        <p>
            Create a course first.
        </p>

    </div>

    <div class="course-grid"
         th:if="${!#lists.isEmpty(courses)}">

       


<a th:each="course : ${courses}"
   th:href="@{/offering/addpage(courseId=${course.id})}"
   class="course-card">
  
            <img th:src="${course.imageUrl}"
                 alt="Course">

            <div class="course-content">

                <h3 th:text="${course.title}">
                </h3>

                <p th:text="${course.description}">
                </p>

                <span class="open-btn">
                    View Offerings →
                </span>

            </div>

        </a>

    </div>

</div>

</body>
</html>

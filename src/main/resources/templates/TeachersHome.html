<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
    
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Inter", sans-serif;
}

body {
  background: #f4f7fc;
  padding: 30px;
}

.dashboard {
  max-width: 1300px;
  margin: auto;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.topbar h1 {
  font-size: 32px;
  font-weight: 800;
}

.topbar p {
  color: #666;
  margin-top: 5px;
}

.logout-btn {
  background: #ff4d4d;
  color: white;
  text-decoration: none;
  padding: 12px 22px;
  border-radius: 10px;
  font-weight: 600;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 30px;
}

.stat-card {
  background: white;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
}

.stat-card h2 {
  font-size: 42px;
  color: #000fe6;
}

.stat-card span {
  display: block;
  margin-top: 10px;
  color: #666;
}

.actions {
  display: flex;
  gap: 15px;
  margin-bottom: 35px;
}

.actions a {
  text-decoration: none;
  background: #000fe6;
  color: white;
  padding: 14px 24px;
  border-radius: 12px;
  font-weight: 600;
}

.course-section {
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
}

.course-section h2 {
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #f7f9ff;
  padding: 15px;
  text-align: left;
}

td {
  padding: 15px;
  border-top: 1px solid #eee;
}

button {
  background: #000fe6;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
}
    
    </style>
  </head>

  <body>
  
  
  
  <div th:if="${param.error}">
<script>
alert("Cannot delete course because offerings or sessions exist.");
</script>
</div>


</div>
  
    <div class="dashboard">
      <div class="topbar">
        <div>
          <h1>Teacher Dashboard</h1>
              <span th:text="${teacher.name}"></span> 👋
        </div>

        <a href="/logout" class="logout-btn"> Logout </a>
      </div>

      <div class="stats">
        <div class="stat-card">
         <h2 th:text="${totalCourses}"></h2>
          <span>Total Courses</span>
        </div>

        <div class="stat-card">
         <h2 th:text="${totalOfferings}"></h2>
          <span>Total Offerings</span>
        </div>

        <div class="stat-card">
          <h2 th:text="${totalSessions}"></h2>
          <span>Total Sessions</span>
        </div>
      </div>

      <div class="actions">
<a href="/course/courses">+ Create Course</a>
<a href="/offering/offerings">
    + Create Offering
</a>
<a href="/session/offeringlist">
    + Create Session
</a>

      </div>

      <div class="course-section">
        <h2>My Courses</h2>

        <table>
          <thead>
            <tr>
              <th>Course</th>
              <th>Offerings</th>
              <th>Sessions</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody>

<tr th:each="course : ${courses}">

    <td th:text="${course.title}">
        Course Name
    </td>

    <td th:text="${course.offeringCount}">
</td>

<td th:text="${course.sessionCount}">
</td>
    <td>
        <a th:href="@{/course/delete/{id}(id=${course.id})}">
            <button>
                Delete
            </button>
        </a>
    </td>

</tr>

</tbody>        </table>
      </div>
    </div>
  </body>
</html>

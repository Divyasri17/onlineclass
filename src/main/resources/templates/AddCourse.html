<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Inter",sans-serif;
        }

        body{
            background:#f4f7fc;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .course-container{
            width:100%;
            max-width:750px;
            background:white;
            padding:40px;
            border-radius:25px;
            box-shadow:0 15px 35px rgba(0,0,0,0.08);
        }

        .course-header{
            text-align:center;
            margin-bottom:35px;
        }

        .course-header h1{
            font-size:36px;
            color:#111827;
            margin-bottom:10px;
        }

        .course-header p{
            color:#6b7280;
            font-size:15px;
        }

        .input-group{
            margin-bottom:25px;
        }

        .input-group label{
            display:block;
            margin-bottom:10px;
            font-weight:600;
            color:#111827;
        }

        .input-group input,
        .input-group textarea{
            width:100%;
            padding:15px;
            border:2px solid #e5e7eb;
            border-radius:12px;
            font-size:15px;
            transition:0.3s;
        }

        .input-group input:focus,
        .input-group textarea:focus{
            outline:none;
            border-color:#000fe6;
            box-shadow:0 0 0 4px rgba(0,15,230,0.1);
        }

        .input-group textarea{
            min-height:140px;
            resize:none;
        }

        .image-preview{
            margin-top:20px;
            width:100%;
            height:250px;
            border-radius:18px;
            overflow:hidden;
            background:#eef2ff;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .image-preview img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .submit-btn{
            width:100%;
            padding:16px;
            border:none;
            background:#000fe6;
            color:white;
            font-size:17px;
            font-weight:700;
            border-radius:14px;
            cursor:pointer;
            transition:0.3s;
            margin-top:25px;
        }

        .submit-btn:hover{
            background:#000cc0;
            transform:translateY(-2px);
        }

    </style>
</head>
<body>

<div class="course-container">

    <div class="course-header">

        <h1>Create New Course</h1>

        <p>
            Add your course details and continue to create offerings.
        </p>

    </div>

    <form action="/course/save" method="post">

        <div class="input-group">

            <label>Course Title</label>

            <input type="text"
                   name="title"
                   placeholder="Enter course title"
                   required>

        </div>

        <div class="input-group">

            <label>Course Description</label>

            <textarea name="description"
                      placeholder="Describe your course"
                      required></textarea>

        </div>

        <div class="input-group">

            <label>Course Image URL</label>

            <input type="text"
                   id="imageUrl"
                   name="imageUrl"
                   placeholder="Paste image URL"
                   required>

        </div>

        <div class="image-preview">

            <img id="preview"
                 src="https://placehold.co/800x400?text=Course+Preview"
                 alt="Preview">

        </div>

        <button type="submit"
                class="submit-btn">

            Create Course 🚀

        </button>

    </form>

</div>

<script>

const imageInput =
      document.getElementById("imageUrl");

const preview =
      document.getElementById("preview");

imageInput.addEventListener("input", () => {

    preview.src = imageInput.value;

});

</script>

</body>
</html>

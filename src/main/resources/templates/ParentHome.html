<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parent Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Inter",sans-serif;
}

body{
    background:#f4f7fc;
    min-height:100vh;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:30px 60px;
}

.left h1{
    font-size:38px;
    font-weight:800;
    color:#111827;
}

.left p{
    margin-top:8px;
    color:#6b7280;
    font-size:18px;
}

.logout{
    background:#ff4d4d;
    color:white;
    text-decoration:none;
    padding:12px 24px;
    border-radius:12px;
    font-weight:600;
}

.section{
    padding:0 60px 50px;
}

.section-title{
    font-size:28px;
    margin-bottom:25px;
    color:#111827;
}

.course-slider{
    display:flex;
    gap:25px;
    overflow-x:auto;
    padding-bottom:20px;
}

.course-slider::-webkit-scrollbar{
    height:8px;
}

.course-slider::-webkit-scrollbar-thumb{
    background:#000fe6;
    border-radius:20px;
}

.course-card{

    min-width:350px;
    max-width:350px;

    background:white;

    border-radius:24px;

    overflow:hidden;

    text-decoration:none;

    color:black;

    box-shadow:
    0 8px 25px rgba(0,0,0,.08);

    transition:.3s;
}

.course-card:hover{

    transform:
    translateY(-8px);

    box-shadow:
    0 20px 40px rgba(0,15,230,.15);
}

.course-card img{

    width:100%;
    height:220px;

    object-fit:cover;
}

.card-body{

    padding:22px;
}

.card-body h2{

    color:#000fe6;

    margin-bottom:12px;
}

.card-body p{

    color:#64748b;

    line-height:1.6;

    margin-bottom:15px;
}

.price{

    color:#111827;

    font-weight:700;

    font-size:20px;
}

</style>
</head>

<body>


<div th:if="${param.success}">
<script>
alert(
"Course enrolled successfully."
);
</script>
</div>


<div class="header">

    <div class="left">

        <h1>Parent Dashboard</h1>

        <p>
            Welcome,
            <span th:text="${parent.name}"></span>
            👋
        </p>

    </div>

    <a href="/parent/logout"
       class="logout">
       Logout
    </a>

</div>

<div class="section">

    <h2 class="section-title">
        Available Courses
    </h2>

    <div class="course-slider">

        <a class="course-card"
           th:each="course : ${courses}"
           th:href="@{/parent/course/{id}(id=${course.id})}">

            <img th:src="${course.imageUrl}">

            <div class="card-body">

                <h2 th:text="${course.title}">
                    Course Name
                </h2>

                <p th:text="${course.description}">
                    Description
                </p>

                

            </div>

        </a>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Inter",sans-serif;
        }

        body{
            background:#f4f7fc;
            min-height:100vh;
            padding:40px;
        }

        .container{
            max-width:1400px;
            margin:auto;
        }

        .top-section{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:40px;
        }

        .top-section h1{
            font-size:38px;
            font-weight:800;
            color:#111827;
        }

        .add-course-btn{
            text-decoration:none;
            background:#000fe6;
            color:white;
            padding:14px 24px;
            border-radius:12px;
            font-weight:600;
            transition:0.3s;
        }

        .add-course-btn:hover{
            background:#000cc0;
            transform:translateY(-2px);
        }

        .course-slider{
            margin-top:30px;
            display:flex;
            gap:25px;
            overflow-x:auto;
            padding:15px 10px 30px;
            scroll-behavior:smooth;
        }

        .course-slider::-webkit-scrollbar{
            height:10px;
        }

        .course-slider::-webkit-scrollbar-thumb{
            background:#cfd8e3;
            border-radius:20px;
        }

        .course-card{
            min-width:340px;
            max-width:340px;
            background:white;
            border-radius:22px;
            overflow:hidden;
            text-decoration:none;
            color:black;
            box-shadow:0 10px 25px rgba(0,0,0,0.08);
            transition:all 0.35s ease;
            flex-shrink:0;
        }

        .course-card:hover{
            transform:translateY(-10px) scale(1.03);
            box-shadow:0 20px 40px rgba(0,15,230,0.18);
        }

        .course-card img{
            width:100%;
            height:220px;
            object-fit:cover;
        }

        .course-content{
            padding:20px;
        }

        .course-content h3{
            font-size:22px;
            margin-bottom:12px;
            color:#111827;
        }

        .course-content p{
            color:#6b7280;
            line-height:1.6;
            font-size:15px;
        }

        .course-card:hover h3{
            color:#000fe6;
        }

        .no-courses{
            text-align:center;
            margin-top:120px;
        }

        .no-courses h2{
            font-size:32px;
            color:#111827;
            margin-bottom:10px;
        }

        .no-courses p{
            color:#6b7280;
            font-size:16px;
        }

        @media(max-width:768px){

            body{
                padding:20px;
            }

            .top-section{
                flex-direction:column;
                gap:15px;
                align-items:flex-start;
            }

            .course-card{
                min-width:280px;
                max-width:280px;
            }

            .top-section h1{
                font-size:30px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="top-section">

        <h1>My Courses</h1>

       <a href="/course/addpage"
   class="add-course-btn">
    + Add New Course
</a>

    </div>

    <!-- Show if no courses -->
    <div class="no-courses"
         th:if="${#lists.isEmpty(courses)}">

        <h2>No Courses Found</h2>

        <p>
            Click "+ Add New Course" to create your first course.
        </p>

    </div>

    <!-- Show if courses exist -->
    <div class="course-slider"
         th:if="${!#lists.isEmpty(courses)}">

        <a th:each="course : ${courses}"
           th:href="@{/offering/offerings(courseId=${course.id})}"
           class="course-card">

            <img th:src="${course.imageUrl}"
                 alt="Course Image">

            <div class="course-content">

                <h3 th:text="${course.title}">
                    Course Title
                </h3>

                <p th:text="${course.description}">
                    Course Description
                </p>

            </div>

        </a>

    </div>

</div>

</body>
</html>
